[project]

# Information
site_name = "Cytoscape 中文用户手册"
site_description = "Cytoscape 中文用户手册 | Cytoscape User Manual (Chinese Version)"
site_author = "范叶亮 | Leo Van"
site_url = "https://cytosacpe.leovan.tech"
copyright = """
版权所有 &copy; 2021-2026，<a href="https://leovan.me" target="_blank">范叶亮 | Leo Van</a>
"""

# Repository
repo_name = "leovan/cytoscape-manual"
repo_url = "https://github.com/leovan/cytoscape-manual"

# Javascript
extra_javascript = [
  "javascripts/mathjax.js",
  "https://cdn.jsdmirror.com/npm/mathjax@4/tex-chtml.js",
  "https://cdn.jsdmirror.com/npm/tablesort@5.7.0/dist/tablesort.min.js",
  "javascripts/tablesort.js",
]

# Style
extra_css = [
  "stylesheets/extra.css",
]

# Navigation
nav = [
  { "主页" = "index.md" },
  { "简介" = "introduction.md" },
  { "启动 Cytoscape" = "launching-cytoscape.md" },
  { "命令行参数" = "command-line-arguments.md" },
  { "快速教程" = "quick-tour-of-cytoscape.md" },
  { "创建网络" = "creating-networks.md" },
  { "嵌套网络" = "nested-networks.md" },
  { "支持的网络文件格式" = "supported-network-file-formats.md" },
  { "节点和边列数据" = "node-and-edge-column-data.md" },
  { "列数据函数和方程" = "column-data-functions-and-equations.md" },
  { "搜索和过滤节点和边" = "finding-and-filtering-nodes-and-edges.md" },
  { "导航和布局" = "navigation-and-layout.md" },
  { "样式" = "styles.md" },
  { "网络注释" = "annotations.md" },
  { "应用商店" = "app-store.md" },
  { "命令面板" = "command-panel.md" },
  { "网页浏览器" = "web-browser.md" },
  { "合并" = "merge.md" },
  { "网络分析器" = "network-analyzer.md" },
  { "富集表格" = "enrichment-table.md" },
  { "首选项" = "preferences.md" },
  { "Linkout" = "linkout.md" },
  { "面板" = "panels.md" },
  { "渲染引擎" = "rendering-engine.md" },
  { "数据导出" = "export-your-data.md" },
  { "Cytoscape 和 OpenCL" = "cytoscape-and-opencl.md" },
  { "Cytoscape.js 和 Cytoscape" = "cytoscape-js-and-cytoscape.md" },
  { "自动化" = "automation.md" },
  { "隐私政策" = "privacy-policy.md" },
  { "基础分析教程" = "basic-expression-analysis-tutorial.md" },
]

# Theme
[project.theme]

favicon = "images/cytoscape3-icon.png"
logo = "images/cytoscape3-icon.png"

language = "zh"

features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  # "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
primary = "orange"
accent = "orange"
toggle.icon = "lucide/sun"
toggle.name = "切换至暗黑模式"

[[project.theme.palette]]
scheme = "slate"
primary = "orange"
accent = "orange"
toggle.icon = "lucide/moon"
toggle.name = "切换至亮色模式"

[project.theme.icon]
repo = "fontawesome/brands/git-alt"

# Extra
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/leovan"

[[project.extra.social]]
icon = "fontawesome/solid/house"
link = "https://leovan.me"

[project.extra.analytics]
provider = "google"
property = "G-7TZ9SS38QN"

# Extensions
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink =  true
toc_depth = 3

[project.markdown_extensions.toc.slugify]
object = "pymdownx.slugs.slugify"
kwds = { case = "lower" }

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.blocks.caption]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji" 
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.progressbar]
[project.markdown_extensions.pymdownx.snippets]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true

[project.markdown_extensions.pymdownx.tabbed.slugify]
object = "pymdownx.slugs.slugify"
kwds = { case = "lower" }

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.tilde]
